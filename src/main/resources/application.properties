# ============================================
# Student Management System — Configuration
# Credentials come from environment variables; never commit real secrets.
#   DB_URL, DB_USERNAME, DB_PASSWORD, SERVER_PORT, CORS_ALLOWED_ORIGINS
# ============================================
spring.application.name=student-management-system

# ---------- MySQL ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_management_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=10000

# ---------- JPA / Hibernate ----------
# 'update' keeps the schema in sync during development; use 'validate' with database/setup.sql in production.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- Server ----------
server.port=${PORT:${SERVER_PORT:8080}}
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json

# Cache static assets for one hour
spring.web.resources.cache.cachecontrol.max-age=3600

# ---------- Jackson ----------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ---------- CORS ----------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080}
